name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Baeum Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses & ensure API 36.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36.1" || "$SDKMANAGER" "platform-tools" "platforms;android-36"
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Debug Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: baeum-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Downloadable Debug APK to GitHub Releases
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          APK_OUT="BAEUM-v1.0-debug.apk"
          cp "$APK_SRC" "$APK_OUT"
          SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          SIZE_MB=$(du -h "$APK_OUT" | awk '{print $1}')

          cat > release-notes.md <<EOF
          ## Unduh BAEUM Android APK Langsung
          Klik **\`${APK_OUT}\`** (${SIZE_MB}) pada bagian **Assets** di bawah untuk langsung mengunduh dan memasang aplikasi di perangkat Android (Android 7.0+ / minSdk 24).

          - **Branch**: \`${SOURCE_REF}\`
          - **Commit**: \`${TARGET_SHA}\`
          - **Unit Tests**: \`:app:testDebugUnitTest\` ✓
          - **SHA-256**: \`${SHA256}\`

          ### Fitur Utama Versi Ini
          - **Seoul Atelier Luxury UI/UX**: tipografi Hangul penuh, kontras WCAG AA Dark/Light, kanvas tulis Hangul Bezier halus, motion/chart zero-alloc 120fps.
          - **Simulasi Ujian Autentik TOPIK I/II, EPS-TOPIK & TOPIK Speaking**: penilaian khusus di akhir ujian + skor, koreksi kunci jawaban, dan penjelasan lengkap.
          - **Seoul Atelier Habit & Flow Engine**: 10 Peringkat Korea + XP, Streak Shield otomatis, 7-Day Rhythm, **Daily Seoul Spark**, **Daily Atelier Quests**, **60s Seoul Blitz** (SEOUL FEVER & +2s bonus), **12 Stempel Dojang**, konfeti 120fps, dan efek suara pentatonis Korea.
          EOF

          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk "${APK_OUT}#BAEUM v1.0 Android APK (${SIZE_MB})" --clobber
            gh release edit latest-apk \
              --title "BAEUM v1.0 — Latest Android APK" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create latest-apk "${APK_OUT}#BAEUM v1.0 Android APK (${SIZE_MB})" \
              --target "$TARGET_SHA" \
              --title "BAEUM v1.0 — Latest Android APK" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Prepare release keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is missing. Add KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: baeum-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Downloadable Release APK to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_OUT="BAEUM-v1.0-release.apk"
          cp "$APK_SRC" "$APK_OUT"
          SIZE_MB=$(du -h "$APK_OUT" | awk '{print $1}')
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk "${APK_OUT}#BAEUM v1.0 Release APK (${SIZE_MB})" --clobber
          else
            gh release create latest-apk "${APK_OUT}#BAEUM v1.0 Release APK (${SIZE_MB})" \
              --target "$TARGET_SHA" \
              --title "BAEUM v1.0 — Latest Android APK" \
              --latest
          fi

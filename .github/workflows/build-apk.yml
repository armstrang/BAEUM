name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - aab

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Baeum Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app versionName from Gradle
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_NAME="v${VERSION_NAME}"
          if echo "$VERSION_NAME" | grep -qiE '(alpha|beta|rc)'; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Detected version=${VERSION_NAME}, tag=${TAG_NAME}, prerelease=${IS_PRERELEASE}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses & ensure API 36.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36.1" || "$SDKMANAGER" "platform-tools" "platforms;android-36"
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Debug Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: baeum-${{ steps.version.outputs.version_name }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Versioned Debug APK to GitHub Releases
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          APK_OUT="BAEUM-v${VERSION_NAME}-debug.apk"
          cp "$APK_SRC" "$APK_OUT"
          SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          SIZE_MB=$(du -h "$APK_OUT" | awk '{print $1}')

          RELEASE_LABEL="Pre-Release Beta"
          PRERELEASE_FLAG="--prerelease"
          if [ "$IS_PRERELEASE" != "true" ]; then
            RELEASE_LABEL="Stable Release"
            PRERELEASE_FLAG="--latest"
          fi

          cat > release-notes.md <<EOF
          ## BAEUM \`${TAG_NAME}\` (${RELEASE_LABEL})

          Klik **\`${APK_OUT}\`** (${SIZE_MB}) pada bagian **Assets** di bawah untuk langsung mengunduh dan memasang aplikasi di perangkat Android (Android 7.0+ / \`minSdk 24\`).

          - **Versi**: \`${VERSION_NAME}\` (${RELEASE_LABEL})
          - **Branch**: \`${SOURCE_REF}\`
          - **Commit**: \`${TARGET_SHA}\`
          - **Unit Tests**: \`:app:testDebugUnitTest\` ✓
          - **SHA-256**: \`${SHA256}\`

          ### Sorotan Fitur \`${TAG_NAME}\` (\`com.armstrang.baeum\`)
          - **Siap Play Store Closed Testing**: Package ID resmi **\`com.armstrang.baeum\`** + signed Android App Bundle (**\`BAEUM-${TAG_NAME}-playstore.aab\`**) siap langsung diunggah ke Google Play Console.
          - **120fps Seoul Atelier Motion Engine**:
            - Unified physical spring press di seluruh kartu kaca, tombol utama/sekunder, dan ikon navigasi.
            - Transisi layar *parallax depth push/pop*, *root crossfade* mulus (*Splash → Onboarding → Beranda*), dan *liquid-morphing capsule* pada *Floating Dock* & *3-Track Ribbon*.
            - Animasi *Sentence Builder* elastis (*spring chip pop-in*, *tray resize*, *silk unfurl* petunjuk & selebrasi), bintang emas \`★★★\` berurutan, *Stage Boss* timer pulse, & *living silk aurora backdrop*.
          - **3 Jalur Silabus Terpandu (30 Pelajaran · 60 Susun Kalimat · 8 Bos Tahap)** + **Auto-Fade Romanisasi** + **Listening-First** + **Brankas Kesalahan** + **Backup & Restore JSON Penuh**.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${APK_OUT}#BAEUM ${TAG_NAME} Android APK (${SIZE_MB})" --clobber
            gh release edit "$TAG_NAME" \
              --title "BAEUM ${TAG_NAME} (${RELEASE_LABEL})" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          else
            gh release create "$TAG_NAME" "${APK_OUT}#BAEUM ${TAG_NAME} Android APK (${SIZE_MB})" \
              --target "$TARGET_SHA" \
              --title "BAEUM ${TAG_NAME} (${RELEASE_LABEL})" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          fi

      - name: Prepare release keystore
        id: keystore
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'aab')) }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Error: KEYSTORE_BASE64 secret is missing."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secret not configured; skipping signed AAB build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        if: ${{ steps.keystore.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Build & Verify Play Store Android App Bundle (.aab)
        if: ${{ steps.keystore.outputs.ready == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'aab')) }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          gradle :app:bundleRelease --no-daemon
          AAB_SRC=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          AAB_OUT="BAEUM-v${VERSION_NAME}-playstore.aab"
          cp "$AAB_SRC" "$AAB_OUT"
          jarsigner -verify -certs "$AAB_OUT"
          echo "Verified signed Play Store AAB: $AAB_OUT ($(du -h "$AAB_OUT" | awk '{print $1}'))"

      - name: Upload Play Store AAB Artifact
        if: ${{ steps.keystore.outputs.ready == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'aab')) }}
        uses: actions/upload-artifact@v4
        with:
          name: baeum-${{ steps.version.outputs.version_name }}-playstore-aab
          path: BAEUM-v${{ steps.version.outputs.version_name }}-playstore.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed Play Store AAB to GitHub Releases
        if: ${{ steps.keystore.outputs.ready == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'aab')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          AAB_OUT="BAEUM-v${VERSION_NAME}-playstore.aab"
          SIZE_MB=$(du -h "$AAB_OUT" | awk '{print $1}')
          PRERELEASE_FLAG="--prerelease"
          RELEASE_LABEL="Pre-Release Beta"
          if [ "$IS_PRERELEASE" != "true" ]; then
            PRERELEASE_FLAG="--latest"
            RELEASE_LABEL="Stable Release"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${AAB_OUT}#BAEUM ${TAG_NAME} Play Store AAB (${SIZE_MB})" --clobber
          else
            gh release create "$TAG_NAME" "${AAB_OUT}#BAEUM ${TAG_NAME} Play Store AAB (${SIZE_MB})" \
              --target "$TARGET_SHA" \
              --title "BAEUM ${TAG_NAME} (${RELEASE_LABEL})" \
              $PRERELEASE_FLAG
          fi

      - name: Upload Release APK Artifact
        if: ${{ steps.keystore.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: baeum-${{ steps.version.outputs.version_name }}-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Versioned Release APK to GitHub Releases
        if: ${{ steps.keystore.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_OUT="BAEUM-v${VERSION_NAME}-release.apk"
          cp "$APK_SRC" "$APK_OUT"
          SIZE_MB=$(du -h "$APK_OUT" | awk '{print $1}')
          PRERELEASE_FLAG="--prerelease"
          RELEASE_LABEL="Pre-Release Beta"
          if [ "$IS_PRERELEASE" != "true" ]; then
            PRERELEASE_FLAG="--latest"
            RELEASE_LABEL="Stable Release"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${APK_OUT}#BAEUM ${TAG_NAME} Release APK (${SIZE_MB})" --clobber
          else
            gh release create "$TAG_NAME" "${APK_OUT}#BAEUM ${TAG_NAME} Release APK (${SIZE_MB})" \
              --target "$TARGET_SHA" \
              --title "BAEUM ${TAG_NAME} (${RELEASE_LABEL})" \
              $PRERELEASE_FLAG
          fi

      - name: Clean up temporary release keystore
        if: always()
        run: rm -f my-upload-key.jks
